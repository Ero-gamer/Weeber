name: Release Build + KeyGen

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore store password'
        required: false
        default: ''
      key_alias:
        description: 'Key alias'
        required: false
        default: ''
      key_password:
        description: 'Key password'
        required: false
        default: ''
      generate_keystore:
        description: 'Generate NEW keystore? (yes/no) — only needed first time or if lost'
        required: false
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper

      - name: Resolve signing credentials
        id: creds
        run: |
          # Prefer manually-typed inputs over secrets (inputs take priority)
          STORE_PASS="${{ github.event.inputs.store_password }}"
          KEY_ALIAS="${{ github.event.inputs.key_alias }}"
          KEY_PASS="${{ github.event.inputs.key_password }}"

          # Fall back to saved secrets if inputs are blank
          [ -z "$STORE_PASS" ] && STORE_PASS="${{ secrets.RELEASE_PASSWORD }}"
          [ -z "$KEY_ALIAS"  ] && KEY_ALIAS="${{ secrets.RELEASE_ALIAS }}"
          [ -z "$KEY_PASS"   ] && KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"

          # Validate
          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "ERROR: store_password, key_alias, and key_password are all required."
            echo "Either type them in the workflow inputs or save them as GitHub secrets."
            exit 1
          fi

          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_alias=$KEY_ALIAS"   >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS"     >> $GITHUB_OUTPUT

      - name: Prepare keystore
        run: |
          GENERATE="${{ github.event.inputs.generate_keystore }}"

          if [ "$GENERATE" = "yes" ]; then
            echo "Generating new keystore..."
            keytool -genkey -v \
              -keystore release.keystore \
              -alias "${{ steps.creds.outputs.key_alias }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ steps.creds.outputs.store_pass }}" \
              -keypass "${{ steps.creds.outputs.key_pass }}" \
              -dname "CN=Weeber, OU=App, O=Weeber, L=Oran, ST=Es Senia, C=DZ"

            echo ""
            echo "========================================================"
            echo "NEW KEYSTORE GENERATED. Copy the base64 below and save"
            echo "it as the RELEASE_KEYSTORE GitHub secret so future"
            echo "builds reuse the same key (required for APK updates):"
            echo "========================================================"
            base64 -w 0 release.keystore
            echo ""
            echo "========================================================"

          elif [ -n "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "Restoring keystore from secret..."
            echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.keystore

          else
            echo "ERROR: No keystore found."
            echo "Set generate_keystore=yes on first run, then save the printed base64 as RELEASE_KEYSTORE secret."
            exit 1
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=${{ steps.creds.outputs.store_pass }} \
            -Pandroid.injected.signing.key.alias=${{ steps.creds.outputs.key_alias }} \
            -Pandroid.injected.signing.key.password=${{ steps.creds.outputs.key_pass }} \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Weeber-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
