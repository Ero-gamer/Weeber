name: Release Build + KeyGen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper

      - name: Generate or restore keystore
        run: |
          # If a saved keystore secret exists, use it. Otherwise generate a new one.
          if [ -n "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "Using existing keystore from secret."
            echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.keystore
          else
            echo "No keystore secret found — generating a new one."
            keytool -genkey -v \
              -keystore release.keystore \
              -alias "${{ secrets.RELEASE_ALIAS || 'weeber' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.RELEASE_PASSWORD }}" \
              -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" \
              -dname "CN=Erogamer, OU=Weeber, O=Weeber, L=Unknown, ST=Es Senia, C=DZ"
            echo ""
            echo "================================================================"
            echo "NEW KEYSTORE GENERATED."
            echo "Save the base64 below as your RELEASE_KEYSTORE secret so future"
            echo "builds use the same key (required for app updates):"
            echo "================================================================"
            base64 -w 0 release.keystore
            echo ""
            echo "================================================================"
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }} \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Weeber-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
